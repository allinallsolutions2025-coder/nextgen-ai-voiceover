name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-android.yml"
      - "package.json"
      - "vite.config.js"
      - "src/**"
      - "scripts/download-model.js"
      - "scripts/copy-ort-assets.js"
      - "scripts/generate-pwa-icons.js"
      - "scripts/validate-offline-bundle.js"
      - "scripts/validate-apk.js"
      - "capacitor.config.json"

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build offline Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download English Kokoro model and build app
        run: npm run build:offline

      - name: Generate Android project
        run: npx cap add android

      - name: Sync bundled web app and model
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Verify model and English voices inside APK
        run: node scripts/validate-apk.js

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-ai-voiceover-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-apk-bundle-report.json
          if-no-files-found: error
          retention-days: 30
