name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-desktop.yml"
      - "package.json"
      - "vite.config.js"
      - "src/**"
      - "scripts/download-model.js"
      - "scripts/copy-ort-assets.js"
      - "scripts/generate-pwa-icons.js"
      - "electron/**"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download English Kokoro model and build app
        run: npm run build:offline

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Build macOS disk images
        if: matrix.platform == 'macos'
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never

      - name: Build Linux packages
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux AppImage deb --x64 --publish never

      - name: Upload Windows installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-ai-voiceover-windows
          path: release/*-win-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS disk images
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-ai-voiceover-macos
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux packages
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-ai-voiceover-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30
