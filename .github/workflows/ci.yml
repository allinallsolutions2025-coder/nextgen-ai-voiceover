name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate multilingual backend source
        run: |
          python -m py_compile backend/app.py backend/voice_catalog.py
          python -m unittest discover -s backend -p "test_*.py"

      - name: Verify deployment output
        run: |
          test -s dist/index.html
          test -s dist/src/main.js
          test -s dist/src/lib/voice-catalog.js
          test -s dist/src/styles.css
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          test -s dist/icon.svg
          test -d dist/ort
          test -f dist/.nojekyll
          test ! -e dist/backend
          test ! -e dist/docs
          test ! -e dist/.github
