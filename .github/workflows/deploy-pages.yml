name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/**"
      - "public/**"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-site.js"
      - "scripts/generate-voice-previews.js"
      - "scripts/check-build.js"
      - "scripts/copy-ort-assets.js"
      - "scripts/generate-pwa-icons.js"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate pre-built English voice previews
        run: node scripts/generate-voice-previews.js

      - name: Save generated WAV previews in GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/voice-previews/ package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync English voice previews and npm lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Generated assets and npm lockfile are already committed."
          fi

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish preview
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
